name: Create rfsuite-lua-ethos-lite ZIP on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # A flight is a state machine that only misbehaves across a link loss, which
  # no build and no package step can reach. Before this job the repository had no
  # way to run a Lua check at all, so this is where the flight-record behaviour
  # is pinned: a brief in-flight drop stays one record, and a pack swap stays
  # two.
  flight-record:
    name: Flight record across a link loss
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the flight record behaviour
        run: lua5.4 bin/flight_record/verify_flight_record.lua

  # Every file the suite owns was opened for writing directly, and io.open(path,
  # "w") truncates on open -- so a radio switched off mid-save left
  # settings.ini at 0 bytes or half a section, and the INI reader skips lines it
  # does not recognise, which means the pilot's settings came back as the
  # defaults with nothing reported anywhere. A build and a package step cannot
  # reach that, and no page shows it: this is where the write path is pinned.
  # The first case in the check goes red on the pre-fix ini.lua.
  atomic-writes:
    name: Settings survive an interrupted write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the write path
        run: lua5.4 bin/storage/verify_atomic_writes.lua

  # The ESC forward-programming tiles are gated by a guard that has to retry a
  # failed MSP read. That retry reaches neither a build nor a package step, so
  # it is pinned here. #2387
  esc-guard-retry:
    name: ESC tiles recover from a failed read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check that a failed ESC read is retried
        run: lua5.4 bin/esc_guard/verify_esc_guard_retry.lua

  # An MSP request that is abandoned between two of its frames used to leave
  # the shared TX buffer occupied, after which no request could be framed at all
  # -- every configuration page then hung until the script was reloaded. No
  # build and no package step reaches that: it needs a queue, a clock and a
  # link that stops answering, so the behaviour is pinned here instead.
  msp-queue:
    name: MSP queue after an aborted request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the MSP queue behaviour
        run: lua5.4 bin/msp_queue/verify_msp_queue.lua

  # Every 4-way forward-programming page -- AM32, BLHeli_S, Bluejay,
  # FlyRotor, Scorpion, HW5, OMP, XDFly, YGE, ZTW -- opens on
  # app/pages/esc_forward_4way.lua, which asks the FC how many ESCs there are and
  # then built its selector. It built ALL FOUR rows ("ESC 1".."ESC 4") and greyed
  # out the surplus with button:enable(i <= count), so a single-ESC helicopter saw
  # three dead lines, with nothing in the UI saying why.
  #
  # A control that cannot be used is not a disabled control, it is noise, and on a
  # 480x320 screen it was a third of the page. The selector now builds only the ESCs
  # that exist, and with exactly one ESC there is no choice to offer, so there is no
  # selector at all and the page goes straight to that ESC.
  #
  # The second half is where the trap is. The FC's answer has THREE distinguishable
  # states, not two: a count of 1, no count at all because the reply carried no
  # motor_count_blheli, and a read that failed. Collapsing the last two into "one
  # ESC" would enter pass-through on a two-ESC helicopter because the read came back
  # thin, so an unknown count keeps the selector and keeps this page's long-standing
  # conservative default of ESC 1 only. The harness pins all three states.
  #
  # No existing harness loads this page: the other ESC harnesses stub it precisely
  # to avoid its os.clock() delays (verify_esc_signature.lua:464-470), which is why
  # the dead rows survived. This one loads it from its path and drives the real
  # header and close_key.
  #
  # The issue's other half -- dropping the parsed cache on page exit -- needs no
  # code and did not get any. It has been in place since the total rewrite (#2256,
  # 2026-08-07), seventeen days before #2338 was filed: esc_forward_vendor.lua:124-156
  # resets the FBL control with clearQueue, closes the dialog, nils pendingData and
  # pendingError, disposes the runtime, drops every handler, unloads the codec from
  # package.loaded and collects. open() issues a fresh read on every call
  # (esc_forward_vendor.lua:295), so no cache can survive. One check here pins that
  # reset so the claim keeps being true.
  #
  # 5 of its 18 checks are gates. Pass --self-test to prove that: it cuts the four
  # pieces out, re-runs every check against the sabotaged page and requires each gate
  # to turn red, comparing verdicts BY NAME. Getting there took three corrections
  # that are worth recording: nine checks were marked gates that cannot fail; the
  # sabotage was missing the enable expression, so the dead-row check stayed green;
  # and with the row bound reverted but the new reply callbacks left in, pass 2
  # CRASHED -- the pre-fix button:enable(i <= targetCount) raises on a nil count,
  # which is why its "targetCount = 1" on a failed read was load-bearing and not
  # tidiness.
  #
  esc-target-selector:
    name: The ESC selector offers only the ESCs that exist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check that a single-ESC setup shows no dead ESC rows
        run: lua5.4 bin/esc_target_selector/verify_esc_target_selector.lua

  # A flight log is the pilot's evidence after a crash, and both ways it could
  # lose rows were silent: an io.open that failed emptied the buffer, and a failed
  # write() trimmed the rows it had just failed to persist. Neither leaves a trace
  # -- the CSV looks like a log that worked and simply recorded nothing.
  #
  # Only a card that cannot be written reaches either path, and that is not
  # something a build or a package step can stage. So the real logger is driven
  # here with io.open and the handle's write() as the seams, and every sample is
  # identifiable, so "were rows 1 to 20 written?" is a fact about the bytes.
  #
  # 13 of its 18 cases go red on the pre-fix logging.lua; the ones that do not
  # pin the healthy path and the once-per-streak report.
  log-flush-retry:
    name: Flight log keeps samples it could not write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check that an unwritable card does not discard the buffer
        run: lua5.4 bin/logging/verify_log_flush_retry.lua

  # Three drain loops run inside one background-task wakeup with no yield point
  # in between, and each was bounded by a wall-clock deadline set well above what
  # the work needs -- on a single-core MCU competing with Ethos's C++ UI thread,
  # the budget is UI latency. Nothing could see that, and nothing could see the
  # other half: that a deadline read only *between* polls cannot bound one
  # transport.mspPoll() call, which on S.Port walks the sensor's whole native
  # frame queue. This harness drives the three loops against a permanently full
  # queue and a clock that charges real time per frame, so it measures the budget
  # instead of trusting it. The last group is the other half -- bounding the
  # poll must not break reply assembly, which is what says how far a budget may
  # be cut at all.
  clock-budgets:
    name: Background task drain budgets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the drain budgets
        run: lua5.4 bin/perf/verify_clock_budgets.lua

  # Every MSP decoder in the suite funnels through lib/mspcodec.lua, and the one
  # primitive there was not bounds-safe: readU8 returned nil for a byte past the
  # end of the payload where readS8/readU16/readS16/readU32 all substituted 0.
  # That nil was not a missing value. The smartfuel decoder divided a readU8
  # result by 1000, and tasks/msp/queue.lua calls processReply with no pcall and
  # there is none in the task path either, so a short reply raised out of the
  # background task instead of being reported. The battery decoder had the softer
  # version: a nil or a zero standing in for a profile capacity, in a config that
  # still passed session.lua's `if not session.batteryConfig` guard because that
  # guard sees the table and not its contents. A build cannot reach any of that,
  # and a radio only produces a short reply under conditions nobody can script on
  # demand, so the payload lengths are pinned here against the firmware handler's
  # own byte counts instead. Cases 4, 5 and 6 go red on the pre-fix sources.
  msp-codec-battery:
    name: A short MSP payload is reported, not decoded
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the codec and the battery decoders
        run: lua5.4 bin/msp_battery/verify_msp_battery.lua

  tool-ui-lazy:
    name: Tool UI not loaded at boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the tool's load timing
        run: lua5.4 bin/tool_ui/verify_tool_ui_lazy.lua

  # Deferring the tool's UI raises the obvious question: does it add MSP
  # traffic, and does anything accumulate per open/close cycle? This harness
  # counts the requests at bus.publish over three full tool cycles plus 100
  # wakeups inside the guarded menu. It goes red if the guards stop latching
  # (a sabotaged guard produces 309 requests instead of 6).
  tool-ui-no-extra-msp:
    name: Tool adds no MSP requests and accumulates nothing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the MSP request pattern over repeated tool cycles
        run: lua5.4 bin/tool_ui/verify_no_extra_msp.lua

  # Ethos form widgets retain closures across form.clear(), so app/field_layout.lua
  # pools accessor slots to prevent unbounded closure growth across repeat page visits.
  # This job checks poolStats(), slot pooling across pages and visits, and safe detachment
  # of dataRef/controlRef on releaseRuntime().
  field-layout:
    name: Field layout slot pooling and lifecycle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check field layout slot pooling and lifecycle
        run: lua5.4 bin/field_layout/verify_field_layout.lua

  # Widgets and objects load bitmaps on demand, and clearCaches()'s images
  # branch previously had no caller anywhere -- so every decoded dashboard
  # bitmap survived theme reloads, model changes and widget close. The fix
  # wires clearThemeCache() to pass images = true, adds an LRU bound to the
  # decoded-bitmap map, and provides a clearer registry for modules like
  # objects/image/model.lua.
  dashboard-image-caches:
    name: Dashboard image cache eviction and theme reload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check dashboard image cache behaviour
        run: lua5.4 bin/dashboard/verify_image_caches.lua

  # A disconnect used to leave the MSP request queue holding everything an open
  # page had queued, so the next handshake queued FIFO behind a backlog that no
  # flight controller could answer any more. And every completed message forced
  # a full GC cycle -- a call section 9 of the lifecycle doc had already measured
  # as buying nothing. Both need a session task and a collector that can be
  # observed, which no build or package step provides.
  msp-disconnect-gc:
    name: MSP queue on disconnect and the per-message GC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the disconnect and GC behaviour
        run: lua5.4 bin/msp_gc/verify_msp_disconnect.lua

  # The bus is the only channel between the tool, the dashboard and the
  # background task, and publish() calls its handlers synchronously -- a
  # handler that publishes back into the same topic recurses, and in the
  # reference Lua VM every Lua-to-Lua call is one C stack level. This harness
  # drives a real cycle and asserts it terminates at the guard rather than at
  # the VM's own "C stack overflow" (which is what happens without it: 197
  # handler calls), and that the memory log reports the smallest
  # mainStackAvailable it has ever seen.
  stack-bounds:
    name: Bus publish is bounded, stack minimum is tracked
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the publish recursion bound and the stack minimum
        run: lua5.4 bin/stack/verify_stack_bounds.lua

  # Leaving a page -- with the Back key, or by closing the tool -- ran the
  # page's dialog teardown on a form Ethos had already stopped updating, and a
  # save/reload confirmation that was still up outlived the page behind it with
  # an OK button that did nothing. Neither is visible from a build: the first
  # needs a form that refuses writes, the second needs a dialog handle that
  # something else has to own. So the pages are loaded for real here, under a
  # form whose writes raise once teardown starts.
  #
  # Five of its cases go red on the pre-fix pages, each naming the line it
  # fails on.
  dialog-lifecycle:
    name: Dialog teardown when a page is left
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the dialog teardown
        run: lua5.4 bin/dialog_lifecycle/verify_dialog_lifecycle.lua

  # A page tags its data with the profile it was read for, and the tag used to
  # be taken when the read finished rather than when it started. A pilot who
  # switched profile while that read was in flight therefore got the previous
  # profile's values on screen, anchored to the new profile -- and because the
  # anchor matched, nothing ever reloaded. Saving then writes the old profile's
  # values into the new one.
  #
  # Only a switch landing inside an MSP round-trip reaches it, which no build and
  # no package step can stage. So MSP answers are held here rather than delivered
  # inline, and the session.update is delivered while a read is genuinely in
  # flight. Inline delivery makes the whole file vacuous.
  #
  # 5 of its 17 cases go red on the pre-fix page_runtime.lua.
  profile-anchor:
    name: A page's data stays tagged with the profile it came from
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the profile anchor across a switch during a read
        run: lua5.4 bin/page_runtime/verify_profile_anchor.lua

  # Every page's onTool is function(focusFn), and calls focusFn() when its
  # dialog closes or is cancelled. The header's Tool button called it as
  # runtime:onTool(focus), so the page got the runtime table as focusFn and
  # calibrating the accelerometer ended in "focusFn is not callable (a table
  # value)". This presses the real page_runtime.lua's Tool button and closes
  # the dialog the way the pages do; 4 of its 5 checks go red on the pre-fix
  # page_runtime.lua.
  tool-focus:
    name: The Tool button hands a page a callable focus function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the Tool button passes a page its focus function
        run: lua5.4 bin/page_runtime/verify_tool_focus.lua

  # The dashboard wakeup path runs several times a second and session.update
  # is published at up to 20 Hz, so a table rebuilt per call there is the
  # sawtooth in the '[bgtask mem] lua=' log rather than a detail. Three such
  # sites were removed: the subscriber copy in lib/bus.lua, the name table and
  # its result table in getSensorStats(), and the per-call closure in
  # transformValue(). #2384.
  #
  # No build and no package step reaches this -- it needs the collector held off
  # and a loop that calls the function thousands of times, which is what the
  # harness does. Every allocation assertion is paired in both directions: the
  # current code has to come out under the bound and the removed code over it,
  # on every run. A bound that both sides meet proves nothing, and the harness
  # carries the removed implementations precisely so that can be seen. The same
  # run also pins what a pooled iteration copy can get wrong -- a handler
  # unsubscribed long ago must not come back through a leftover slot -- and the
  # one value the change alters, an rssi box reading its own min/max instead of
  # link quality's.
  #
  # Pass --self-test to assert only that the bounds still have teeth.
  wakeup-allocations:
    name: Wakeup path allocates nothing per call
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the wakeup allocation paths
        run: lua5.4 bin/allocation_churn/verify_allocation_churn.lua

  # The collector's pause decides when a cycle starts: live * pause / 100.
  # The default is 200, so the heap may reach twice what is live before anything is
  # reclaimed at all, while Ethos kills a script whose heap passes its limit (#2295).
  # Lowering it is a one-line change -- but the one line has a foot-gun in it, and
  # that is what this pins:
  #
  # `collectgarbage("setpause", n)` returns the PREVIOUS value, and with the
  # argument omitted it does not read the current one, it SETS THE PAUSE TO 0.
  # Pause 0 is "collect as constantly as possible", the opposite of the intent.
  # Measured on Lua 5.3.6 and on 5.4 (what Ethos runs), and the first case here asserts it
  # rather than trusting it, because main.lua's own comment cites the behaviour and
  # a future interpreter could change it.
  #
  # So the applied value is printed at boot instead of read back, and no file under
  # src/ may call either setter without an explicit value. The harness also fixes
  # where the call goes -- before background_task.init(), so the collector is on the
  # new schedule while the subsystems allocate -- and holds the line that separates
  # the justified forced collects from the hot path: Queue:_finish() must stay
  # clean, Queue:clear() and the three ESC dispose paths must keep theirs.
  #
  # Pass --self-test to prove every one of those can go red: each check is aimed at
  # a sabotaged copy of main.lua, at a planted bare setter, and at a queue.lua with
  # its teardown collect cut out.
  gc-pause:
    name: The incremental collector is tuned, and reads no pause it did not set
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the collector pause and the forced collects
        run: lua5.4 bin/gc_pause/verify_gc_pause.lua

  # Every screen but one installed a handler for the physical Back/Close key. The
  # root menu installed none, on the stated assumption that Ethos's own default
  # closes the tool on the first press. It does not -- that default takes two, the
  # first dropping the form's input focus -- so the root menu had two ways out that
  # disagreed with each other: the on-screen Menu button left in one press, the
  # hardware RTN in two. Neither a build nor a package step reaches any of it.
  #
  # The harness drives the real tool.lua through registerSystemTool, create() and
  # event() -- not menu_container directly, because tool.lua's forwarding is part of
  # what is being pinned -- and asserts that RTN and EXIT reach goBack() at the root,
  # that goBack() is the same path the back button takes, that a long ENTER, a model
  # key and a touch event are still passed through untouched, and that RTN in a
  # submenu pops one level without exiting.
  #
  # Seven of its seventeen cases go red on the pre-fix file. Pass --self-test to
  # prove that rather than take it on trust: it re-runs the identical sequence
  # against a copy of app/menu_container.lua with the pre-fix root branch put back
  # and requires every one of the seven to fail.
  root-close-key:
    name: The physical Back key closes the suite from every screen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the root menu close key
        run: lua5.4 bin/tool_ui/verify_root_close_key.lua

  # lib/msp_governor_profile.lua encoded every field as `data[name] or 0`, so a
  # table missing a key became a struct of zeros -- governor_headspeed 0,
  # governor_max_throttle 0 -- and every one of those is a value the firmware
  # accepts as in range. It re-runs its own validateAndFixServoConfig() on it and
  # reports success. There is nothing in the write for a pilot to notice.
  #
  # What this pins is that the encoder refuses instead of inventing, and -- the half
  # that matters -- that the refusal is not merely returned but acted upon: a codec
  # that declines to build a message is a REFUSED write in app/page_runtime.lua, not
  # a message with no payload. Asserting on encode() alone would pass while the
  # runtime published the nil, so the harness drives the real page_runtime with the
  # real codec and reads what went onto the bus.
  #
  # No build and no package step reaches it. The load gate that already existed --
  # any source read failing keeps loaded == false and canSave() false -- is pinned
  # too, so a later change cannot trade one protection for the other.
  #
  # Cases 2, 3 and 4 go red on the pre-fix codec. Pass --self-test to prove that
  # rather than take it on trust: it puts a copy of the codec with the pre-fix
  # encode() in the same seat and requires it to build a 17-byte all-zero payload
  # from an empty table AND requires page_runtime to publish it.
  governor-profile-write:
    name: A governor profile is never written from an incomplete table
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the governor profile write guard
        run: lua5.4 bin/governor_profile/verify_governor_profile_write.lua

  # Ethos aborts any Lua callback that runs 20000 VM instructions ("Max
  # instructions count reached"), and nothing on the radio says how close one
  # runs. This drives the real dashboard widget through every theme and flight
  # state, and the real background task through boot, link up, steady CRSF with
  # ELRS frames, an ELRS backlog and link down, and the real system tool through
  # every menu and every page (opened cold, read replies served by the MSP
  # codecs' simulator fixtures), counting instructions with a debug hook on
  # desktop Lua. Any callback at or over the limit fails, so a theme with too
  # many boxes, a new per-tick cost, or a page that builds its form in one
  # oversized pass is caught here instead of as stalled frames, a dropped
  # background tick in flight, or a page that never draws. The Ports page did
  # exactly that before this check covered the app: its function lists cost
  # ~25k instructions with 4 serial ports and ~255k with 12, in one wakeup.
  instruction-budget:
    name: Callbacks stay under the Ethos instruction limit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the Ethos instruction budget
        run: lua5.4 bin/perf/verify_instruction_budget.lua

  # AM32, BLHeli_S and Bluejay are three tiles of tool.lua's esc_forward_menu that all
  # carry escProtocolId = 1, so the menu guard cannot tell them apart, and all three
  # answer on MSP 217/218 behind the same two-byte header. A pilot who opens the
  # wrong one gets a complete editor full of another ESC's bytes and a working Save.
  #
  # The gate is app/pages/esc_forward_vendor.lua:228-236. isCompatibleEsc() is called
  # in the read's reply callback at :281-295, sets pendingError = {kind = "signature"}
  # and never sets pendingData, so buildEditor() is never reached -- no runtime means
  # no fields, no Save button and no MSP 218 anywhere. All ten ESC tiles declare a
  # signature to check against, and the two BLHeli-family ones need their
  # main_revision as well, because they share 0xC1 and nothing else separates them.
  #
  # The flight controller refuses a cross-signature write too: is4wayParamBufferValid()
  # at src/main/sensors/esc_sensor.c:4591-4622 checks signature, protocol version and
  # length, and escCommitParameters() turns a false into MSP_RESULT_ERROR. But it
  # reports that as an ERROR RETURN, after the editor was built and the pilot had
  # already pressed Save -- and fwifGetEepromAddress() at :703-729 reports every
  # BLHeli-family target as ESC_SIG_BLHELI_S with length 0x70, so for BLHeli_S
  # against Bluejay signature, version and length are identical and the editor gate
  # is the only one there is.
  #
  # No build and no package step reaches any of it, so the three pages and the shared
  # editor are driven for real here, each answered with another vendor's own reply
  # fixture. Case 4 is the other half and matters as much: the matching page has to
  # open and its Save has to put an MSP 218 on the bus, or case 6's "never sent" is
  # also true of a harness whose write path was never live. Not hypothetical -- the
  # first version of this harness stubbed page_runtime, never pressed Save, and had
  # six write checks that stayed green with the gate removed. Its own --self-test is
  # what said so.
  #
  # Pass --self-test to prove the rest: it re-runs every case against a copy of
  # esc_forward_vendor.lua whose isCompatibleEsc() returns true unconditionally and
  # requires all 30 gate checks to fail.
  esc-signature:
    name: An ESC editor never opens on another vendor's ESC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the ESC forward-programming signature gate
        run: lua5.4 bin/esc_signature/verify_esc_signature.lua

  # lib/msp_esc_parameters_yge.lua drew its Motor Timing row from a ten-entry list of UI
  # positions and handed that position to the wire unchanged in both directions. The
  # ESC does not number its timing the way the page does: it spells the four automatic
  # modes 16..19 and the six fixed advance angles 1..6, with 0 a second spelling of the
  # first automatic mode. So every word the ESC sent landed on the wrong row, and every
  # row the pilot picked landed on the wrong word -- measured: an ESC reporting 17 ("Auto
  # Efficient") displayed "Auto Norm", and a pilot selecting "0 deg" wrote 17, a fixed
  # advance angle commanded as an automatic mode. Neither is visible from the page,
  # which shows a position in its own list rather than the ESC's word.
  #
  # The flight controller is a pass-through here -- msp.c reads
  # escGetParamBufferLength() bytes and calls escCommitParameters() without inspecting a
  # field -- so no build and no package step can see any of it. The harness drives the
  # real page, the real shared editor, the real field_layout and the real page_runtime,
  # and answers reads with the codec's own simulatorResponse.
  #
  # 21 of its 38 checks go red on the pre-fix codec. Pass --self-test to prove that
  # rather than take it on trust: it re-runs the file against a copy of the codec with
  # the pre-fix TIMING table, no translation block and the pre-fix decode()/encode(),
  # and requires every one of those 21 to fail. It also requires both passes to have
  # registered the same gates, so a case that runs on one of the two trees and not the
  # other is reported rather than silently compared against nothing.
  #
  # The file also answers the issue's other half, which does NOT reproduce: the reserved
  # bits 4..7 of the flags byte survive a save here, because this page keeps the ESC's
  # byte and edits single bits in place (field_layout.lua:268-272) rather than packing
  # four booleans into a fresh byte the way the EdgeTX page does (edgetx
  # .../yge/page.lua:113-131). Five checks pin that, plus the load gate. They are
  # deliberately not gates: they pass on the pre-fix codec too, and a gate check that
  # cannot go red is worse than no check.
  esc-parameters-yge:
    name: YGE timing words and the flags byte
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the YGE forward-programming codec
        run: lua5.4 bin/esc_parameters_yge/verify_esc_parameters_yge.lua

  # Both ESC forward-programming codecs laid the write payload out from the parsed fields
  # alone. lib/msp_esc_parameters_bluejay.lua and lib/msp_esc_parameters_am32.lua
  # both walked WIRE_FIELDS and wrote one byte per entry from `data[name]`; Bluejay's
  # decode() already kept the ESC's own bytes in `data._raw` and nothing read them.
  #
  # That is not a display bug, because the flight controller merges nothing.
  # msp.c's MSP_SET_ESC_PARAMETERS (msp.c:3397-3409) copies exactly
  # escGetParamBufferLength() bytes over the update buffer and commits that, and that
  # length is a two-byte header plus BLHELI_S_MSP_NUM_EEPROM_BYTES (0x40) for the 0xC1
  # signature Bluejay shares with BLHeli_S, or AM32_NUM_EEPROM_BYTES (0x30) for 0xC2
  # (esc_sensor.c:4553-4570). So Bluejay is 66 bytes and AM32 is 50 -- and the ESC
  # parameter bytes beyond that window are the firmware's own business, kept from its
  # own cache in fourwayIfFetchData (esc_sensor.c:765-819). These first 0x40 bytes are
  # the Lua suite's and nobody else's. Every byte encode() did not reproduce
  # byte-for-byte is a byte the ESC is told changed.
  #
  # Measured on the pre-fix codecs, poking one byte at a time over all 256 values and
  # re-encoding with nothing edited: Bluejay rewrote 130 of the 256 minimum-startup-
  # power bytes, 181 of the maximum-startup-power bytes, one of the PWM-frequency
  # bytes and 155 and 188 of the two PWM-threshold bytes -- 655 in all -- and AM32
  # rewrote 248 of the 256 timing-advance bytes, because two firmware generations
  # number the same four positions differently (0..3 and 10..42 in steps of 8) and
  # both spellings occur in the field. The pre-fix Bluejay encoder also clamped
  # threshold_96to48 onto threshold_48to24 on every save, so an ESC reporting the
  # pair the other way round was corrected whether or not the pilot looked at either
  # row.
  #
  # encode() now starts from a copy of the ESC's own bytes and writes one field only
  # when the pilot moved it off the byte that value came from. It is the rule the
  # EdgeTX suite already applies to its five transformed Bluejay fields
  # (esc_parameters_bluejay.lua's TRANSFORMS / buildWritePayload) and to the AM32
  # timing byte (encodeTimingAdvance), extended from those fields to the whole block.
  # A write with no ESC bytes behind it is now a REFUSED write rather than a payload
  # of zeros, the same shape as lib/msp_governor_profile.lua's refusal and handled by
  # app/page_runtime.lua's existing nil-message branch.
  #
  # The exhaustive check is the one that matters and it is not a sample: every byte
  # position against every one of its 256 values, decode/encode with nothing edited.
  # That is 16896 Bluejay pairs and 12800 AM32 ones, and on the pre-fix codecs it fails
  # at exactly the six positions above. The staged page-level cases exist because
  # every value in the shipped fixtures happens to survive the pre-fix round trip, so
  # a case built on the fixture alone would have passed on the defective codec.
  #
  # No build and no package step reaches any of it: it needs two codecs, a page, a
  # shared editor, a runtime and an MSP round trip. The harness drives the real pages
  # and the real runtime, and stubs app/pages/esc_forward_4way.lua for the reason
  # bin/esc_signature does -- it only picks which ESC to address, and its own
  # os.clock() delays cost about six seconds per open.
  #
  # 14 of its 41 checks go red on the pre-fix codecs. Pass --self-test to prove that
  # rather than take it on trust: it splices the pre-fix codec directions and the
  # pre-fix buildWriteMessage back into copies of both codecs and requires every one
  # of the fourteen to fail. Three things in that self-test were wrong the first time
  # and are recorded here because each of them made the self-test pass without proving
  # anything:
  #   * the spliced codecs were loaded through the normal helper, which reads the
  #     checked-out path and never sees the redirect -- so nine of the seventeen gates
  #     then registered stayed green on the FIXED codec;
  #   * two gates carried identical wording from the two codecs' refusal checks and
  #     collided in the gate list, which the duplicate counter caught;
  #   * the first discriminator for "is this the pre-fix codec?" asked whether byte 7
  #     moved, which proves nothing: 0 is a legal minimum-startup-power byte and
  #     normalizes straight back to 0.
  # And the eight timing-decode cases, the three timing write-direction cases and the
  # Motor KV case are deliberately NOT gates -- they pass on the pre-fix codec too,
  # and a gate check that cannot go red is worse than no check.
  esc-raw-bytes:
    name: An ESC save rewrites only the row the pilot moved
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check that unedited ESC bytes survive a save
        run: lua5.4 bin/esc_raw_bytes/verify_esc_raw_bytes.lua

  # Seven of the twenty-one YGE models have an HV BEC that runs up to 12.0 V, and the BEC
  # Voltage field was capped at 8.4 V for all of them -- because the ceiling is a
  # property of the MODEL and the field took its range from a constant in FIELD_META.
  # app/field_layout.lua's buildField() has always honoured spec.min/spec.max, and
  # app/pages/esc_forward_vendor.lua's fieldSpec() read them from FIELD_META only, so
  # a page had no way to say otherwise. It now resolves them the way it already
  # resolved labels: a value, or a function of the read data.
  #
  # The second half is the flags byte. Its HV-BEC bit (bit 3) has no row on this
  # page -- bits 0 and 1 have rows, bit 3 did not -- so selecting 12.0 V commanded the
  # voltage without the mode that makes it 12 V. The codec sets it from
  # page_runtime's beforeSave hook, the same place and shape
  # msp_esc_parameters_scorpion.lua already uses.
  #
  # Two rules, and the second is the one a reviewer should check: when the pilot MOVED
  # the voltage the bit becomes (voltage == 120), and when they did not the bit is
  # left exactly as the ESC reported it. An ESC reporting 8.4 V with the bit set is in
  # a state this page never produced, and a save that changed the governor gain has no
  # business clearing a BEC setting nobody looked at.
  #
  # The harness found that second rule the hard way: the first version enforced the
  # invariant unconditionally and its own "an unrelated save leaves the bit alone" case
  # went red. It is now the same rule the timing translation in #2456 follows.
  #
  # Finding on the way: the model table was missing [4691] "YGE Saphir 125v2" -- one
  # of the seven 12 V models, and the first one #2337 names. It rendered as
  # "YGE ESC (4691)", and with no entry there was nothing to raise the ceiling for.
  # The EdgeTX table's own comment says why: name and capability used to be two lists,
  # "and adding a model meant remembering both -- which is how 4691 came to be in
  # neither". So this is ONE table carrying both facts, not a second list beside the
  # first.
  #
  # Two entries in the EdgeTX table are worth reading before "correcting" them: [5712]
  # "YGE 165 HVT" and [8272] "YGE 205 HVT" carry neither BEC nor Opto nor v2 in the
  # name and still run to 12.0 V. So "12 V means v2" is not the rule -- it holds for
  # four of the seven, which is what that table happens to contain. This suite asserts
  # parity with it on all 21 entries, and separately that [8272] keeps the owner's v2
  # spelling (2026-10-03). The one field EdgeTX has no notion of is `bec`: only the
  # five Opto models lack one, so their BEC Voltage row is hidden rather than capped.
  # 11 of its 28 checks go red without the fix. Pass --self-test to prove that: it cuts
  # the fix back out of the three files that carry it and requires every one of the
  # eleven to fail -- and verifies its own cut four ways first, because a slice that
  # takes an unrelated table with it looks exactly like a test failure.
  esc-parameters-yge-bec12v:
    name: YGE 12 V BEC ceiling and the HV-BEC bit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the 12 V BEC ceiling and the flag
        run: lua5.4 bin/esc_parameters_yge/verify_yge_bec12v.lua

  # lib/msp_esc_parameters_yge.lua decodes the ESC's own serial number -- WIRE_FIELDS
  # carries {"serial_number", "u32"} and the block is 58 bytes -- and summaryFor() printed
  # two parts, the model label and the firmware version. A pilot with four YGE ESCs had
  # no way to tell them apart on the screen. The EdgeTX suite shows it as the `S/N:` part
  # of its subheader (rotorflight-lua-edgetx-suite src/rfsuite/ui/controls.lua:335-356).
  #
  # Three of the harness's 12 checks go red without the fix, and the third is the one
  # worth reading first: two ESCs that differ only in serial number must not render the
  # same line. That is #2455's complaint stated as something the screen has to do, and it
  # cannot be satisfied by a number written into the codec.
  #
  # The other nine are invariants, and they are registered as checks rather than gates on
  # purpose. Four of them were gates in the first version of this file, and the self-test
  # said what that was worth: "4 of 6 gate checks cannot detect the missing serial
  # number". A codec that shows no serial at all also shows no "S/N 0", raises nothing on
  # a nil, and already wrote the ESC's own serial bytes back unchanged -- so those four
  # asserted the fix without being able to detect it.
  #
  # Two decisions in here look arguable and are not: the sibling suite settles both, and the
  # harness pins the behaviour rather than restating the reasoning.
  # rotorflight-lua-edgetx-suite .../escmfg/yge/init.lua's getEscVersion() is
  #
  #     local sn = getUInt(buffer, {29, 30, 31, 32})
  #     return sn ~= 0 and tostring(sn) or ""
  #
  # which is decimal, and which prints nothing for a 0. So a serial of 0 is left out because
  # "S/N 0" would read like data and identify nothing, and the base is decimal because that
  # is what the reference does.
  #
  # Those indices also settle the offset, which looked wrong at first glance and is not:
  # the sibling reads the serial from {29, 30, 31, 32} because that page carries
  # `local mspHeaderBytes = 2` (yge/init.lua:8) and its getUInt adds it to every index.
  # 29 + 2 = 31, which is exactly where serial_number starts here. Without that line the two
  # suites look two bytes apart and neither of them is wrong.
  #
  # AM32, BLHeli_S and Bluejay decode no serial at all, so there is nothing to show for
  # them and this job does not claim otherwise: whether one is readable over MSP 217 is
  # unchecked.
  esc-parameters-yge-serial:
    name: YGE ESCs can be told apart by their serial number
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the YGE serial number in the summary line
        run: lua5.4 bin/esc_parameters_yge/verify_yge_serial.lua

  # #2340 asks for three things about the FlyRotor forward-programming payload: extend the
  # spec to 56 bytes, make the base and ADV/OTHER sub-page offsets match it, and
  # validate buffer lengths before writing.
  #
  # Measured, the first two were already true and have been all along. The length comes
  # from the flight controller's own page table, not from anybody's transcription of it:
  # rotorflight-firmware src/main/sensors/esc_sensor.c:1931-1932 holds
  # `static uint16_t flyParamPages[] = { 0x0016, 0x160C, 0x220A, 0x2C0A }` with
  # hi-byte = offset and lo-byte = length; flyCalcParamBufferLength() (:2130-2136) sums
  # the low bytes, 22 + 12 + 10 + 10 = 54, and escGetParamFullBufferLength()
  # (:4540-4551) adds PARAM_HEADER_SIZE = 2. So MSP_ESC_PARAMETERS carries 56 bytes for
  # a FlyRotor -- which is exactly what the codec's WIRE_FIELDS summed to and what its
  # shipped simulatorResponse already carried. WIRE_FIELDS lands on all four page
  # boundaries field for field: 8 fields over INFO's 22 bytes, 12 over BASIC's 12, 8
  # over ADV's 10, 7 over OTHER's 10, nothing unmapped and nothing straddling a
  # boundary. A decode/encode round trip with nothing edited changes 0 of 14 336 byte
  # values. The EdgeTX codec computes PAYLOAD_LEN = 56 as well.
  #
  # Two things follow from flyParamPages being a COMPILE-TIME CONSTANT in the flight
  # controller, and both are the opposite of what the issue assumes. 56 is not a floor
  # a newer ESC firmware raises -- the FC never asks the ESC how long its block is. And
  # the four pages are filled one at a time (flyDecodeReadResp, :2138-2157) with the
  # payload only becoming available once every page is cached (:2150-2151), so msp.c
  # returns false for a zero length: a short block is a TRUNCATED READ, not a smaller
  # layout.
  #
  # That is where the defect was, and it is the issue's third point. lib/mspcodec.lua is
  # deliberately bounds-safe -- a byte past the end reads as 0, not nil -- and its own
  # header says a decoder that cannot tolerate a missing field must check the length
  # itself. This codec did not. Measured on the pre-fix codec:
  #
  #     decode(40 bytes) -> encode wrote 56 bytes, 26 of them zero
  #     decode( 3 bytes) -> encode wrote 56 bytes, 55 of them zero
  #     decode( 0 bytes) -> encode wrote 56 bytes, ALL of them zero
  #
  # The signature gate does not catch it, because esc_signature is byte 1 and a 40-byte
  # reply still carries it. And flyParamCommit() (:1964-1987) writes every page whose
  # bytes DIFFER from the FC's cached block, so the zeroed pages are written: ADV lost
  # soft_start, auto_restart_time, restart_acc, gov_p, gov_i, active_freewheel,
  # drive_freq and motor_erpm_max, and OTHER lost throttle_protocol,
  # telemetry_protocol, led_color_index, led_color_rgb, motor_temp_sensor, motor_temp
  # and battery_capacity.
  #
  # The fix is the guard, in the shape lib/msp_battery.lua already uses for the same
  # reason: decode() returns nil plus a reason for a short block and processReply calls
  # onError, so the shared editor never opens on a zeroed tail; encode() refuses a table
  # that is not a decoded one instead of zeroing what it is missing, and
  # buildWriteMessage() declines to build a message, which app/page_runtime.lua already
  # treats as a REFUSED write and reports. Pre-fix, a table missing exactly one field
  # produced a payload with that field zeroed for 33 of the 37 fields, and RAISED for
  # the other four (esc_sn, esc_iap, esc_fw, led_color_rgb -- writeValue() turned the
  # missing value into 0 first and 0 is truthy in Lua, so `bytes or {}` kept the number
  # and writeBytes() indexed it).
  #
  # The width table is now one WIRE table instead of a pair of if-chains in
  # readValue()/writeValue(), and BLOCK_BYTES is summed from it, so the length guard and
  # the layout cannot drift apart.
  #
  # 8 of its 27 checks go red on the pre-fix codec. Pass --self-test to prove that: it
  # splices the pre-fix byte helpers, the pre-fix decode()/encode() and the pre-fix
  # buildReadMessage()/buildWriteMessage() back into a copy of the codec and requires
  # every one of the eight to fail. Four mistakes in that self-test are worth keeping,
  # because each of them made it pass without proving anything:
  #   * the first splice ran from readBytes() to version() and took WIRE and
  #     BLOCK_BYTES with it, so the spliced module had no BLOCK_BYTES and the layout
  #     section raised on a nil in pass 2 -- aborting before the verdict;
  #   * tryWrite() returned the message in both result slots, so every success was
  #     recorded as a raise and the report said all 37 fields raised when only four do;
  #   * it then mapped "raised" onto "declined", which is not the same thing, and two
  #     gates stayed green against a codec that crashes rather than refuses;
  #   * it captured only pcall's first result, so buildWriteMessage()'s refusal REASON
  #     was thrown away and the gate that checks the reason failed on the FIXED codec.
  #
  # Everything in the layout and round-trip sections is deliberately NOT a gate: those
  # are the issue's first two points, already satisfied, and they are here so the claim
  # is a fact the repository carries rather than a sentence in a comment. So is "a block
  # of exactly 56 bytes is accepted" -- that has to hold in both passes, and requiring
  # it to go red would be requiring the harness to fail on correct behaviour.
  esc-flyrotor-payload:
    name: FlyRotor writes 56 bytes and refuses a short block
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the FlyRotor block length and the length guard
        run: lua5.4 bin/esc_flyrotor_payload/verify_flyrotor_payload.lua

  # app/pages/esc_forward_bluejay.lua declared an LED Control row and gated it on
  # msp.supportsLedControl(), which read _raw[67] and compared it with the five ASCII
  # letters naming Bluejay's five LED-capable pinouts. The MSP 217 reply is 66 bytes --
  # two header bytes plus BLHELI_S_MSP_NUM_EEPROM_BYTES (0x40) -- so _raw[67] is nil,
  # the comparison is false, and esc_forward_vendor.lua's fieldEnabled() requires
  # `== true`: the row could never be shown on any ESC. Measured here rather than
  # assumed, because the whole case rests on the length.
  #
  # The row is gone rather than repaired, and the reasons are in the firmware.
  # mathiasvr/bluejay lists all 26 supported ESCs with their LED counts in
  # Bluejay.asm:63-91 and exactly five have one (E_ 3, J_ 3, M_ 1, Q_ 2, U_ 3; every
  # other layout reads "_" there, Z_ reads "-"), but those letters are EQU constants of
  # the build. The EEPROM segment at 1A00h
  # (Bluejay.asm:321-364) holds 41 parameter bytes and not one is a layout letter; the
  # only layout-related byte is Eep_Layout_Revision, written from the firmware-wide
  # EEPROM_LAYOUT_REVISION = 204 (Bluejay.asm:319), which every layout shares. Byte 43
  # of the block IS the LED byte -- Eep_Pgm_LED_Control, segment offset 0x28 -- so the
  # byte can be written, but nothing on the wire says whether writing it does anything.
  # And the row's choice list was BLHeli_S's: Bluejay drives one pin per LED, two bits
  # each, lit when the pair is non-zero (Bluejay.asm:1525-1556), so that list's "Green"
  # is one LED on rather than a colour. Putting the row back means per-LED on/off, which
  # is a decision about the UI and not a repair of this byte. Byte 43 is kept as the name
  # reserved_28, so the block still decodes and re-encodes all 66 bytes -- the flight
  # controller commits exactly escGetParamBufferLength() of them, so a dropped field
  # entry would have shortened the payload rather than removed a row.
  #
  # Three gates. The first is the defect class and outlives this row: no criterion and no
  # label on the page may read a byte the reply does not carry. The reads are traced
  # through a metatable on _raw, so the check reports WHICH byte was reached for, and a
  # revision test like atLeast(209) -- correctly false for a layout-204 ESC -- is not
  # caught, because it reads layout_revision, which decode() did produce. The other two
  # pin the decision itself, so a correct LED row can come back only deliberately, with
  # the criterion that makes it reachable.
  #
  # Four checks are deliberately NOT gates, because they were true before the fix as
  # well: the reply is 66 bytes and has no byte 67, byte 43 round-trips unchanged over
  # all 256 values, every one of the 66 positions still has exactly one owning field,
  # and byte 43 is among them under the name reserved_28. They are the guard on what the
  # rename could have broken.
  #
  # 3 of its 7 checks go red on the pre-fix page and codec. Pass --self-test to prove
  # that rather than take it on trust: it splices the pre-fix row and the pre-fix
  # criterion back into copies of both files, proves each splice is the pre-fix code
  # before letting it stand in for one -- different file, reads back, loads, and writes
  # the same 66 bytes -- and requires all three to fail.
  bluejay-led-control:
    name: The Bluejay LED row is either reachable or absent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the Bluejay LED Control row
        run: lua5.4 bin/bluejay_led_control/verify_bluejay_led_control.lua

  # The FC keeps its tune advisor statistics in RAM; the radio saves each
  # flight on disarm, clears the FC, and the page combines the last 5 flights
  # on the current tune. Pins the capture (one flight per disarm, then a
  # clear; 5 flights kept; a disarm during a link loss captured on reconnect;
  # firmware without the command asked once) and the aggregate (only the
  # newest tune, counts added, ratios weighted).
  tune-history:
    name: Tune Advisor history on disarm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the Tune Advisor history on disarm
        run: lua5.4 bin/tune_history/verify_tune_history.lua

  # Bytes 57..62 of the Scorpion block were carried as three anonymous U16s named
  # padding_1, padding_2 and padding_3, and the summary line read two byte offsets out of
  # the raw block by hand:
  #
  #     return string.format("%s / FW %08X / v%d", model,
  #       uintFromRaw(data, {55, 56, 57, 58}),
  #       uintFromRaw(data, {61, 62}))
  #
  # The sibling suite names those bytes, and the widths add up exactly -- 4 + 2 = the 6
  # bytes the three U16s occupied:
  #
  #     rotorflight-lua-edgetx-suite src/rfsuite/tasks/msp/api/esc_parameters_scorpion.lua
  #     ... {"motor_startup_sound","U16"}, {"serial_number","U32"},
  #         {"firmware_version","U16"}, {"soft_start_time","U16"}, ...
  #
  # So "FW %08X" was assembled from motor_startup_sound (55-56) and the LOW HALF of
  # serial_number (57-58). The page has been showing that number since the codec was
  # written. Nothing that meant anything goes away with it: the version was already on the
  # line as "v%d" from bytes 61-62, which that list calls firmware_version.
  #
  # The reference prints the serial in decimal and prints nothing for a zero
  # (.../escmfg/scorp/init.lua: `local sn = getUInt(buffer, {57, 58, 59, 60})` and
  # `return sn ~= 0 and tostring(sn) or ""`), so both decisions follow it. That page has
  # NO header compensation -- unlike the YGE one, which carries mspHeaderBytes = 2 -- so
  # its byte numbers and this suite's are the same numbers, and the harness checks that
  # against the fixture rather than against a comment.
  #
  # 4 of the harness's 14 checks go red without the change. Two that look like gates are
  # deliberately not, and both earned it:
  #
  #   * the field-list parity check compares two transcriptions and never reads the codec,
  #     so it stayed green while the codec's names were cut back to padding_;
  #   * "two ESCs that differ only in serial do not render the same line" was ALREADY true
  #     before the change, because the word labelled FW was built from bytes that include
  #     the low half of the serial -- true for the wrong reason, which makes it useless as
  #     a gate.
  #
  # The gate that ties the naming claim to the code is the fixture round-trip: the serial
  # the codec decodes has to be the u32 at byte 57, read out of the shipped fixture and
  # out of the page's own decoded table.
  #
  # Two more things the check found while being written, both left as stated gaps rather
  # than fixed here: the sibling decodes stick_max and stick_zero after gov_integral and
  # this suite does not -- and builds no row for either, so nothing can be written into
  # them; and FlyRotor, whose esc_sn this suite already decodes and does not display, is
  # left alone because #2462 changes that same codec and is ahead in the merge order.
  esc-parameters-scorpion-serial:
    name: Scorpion ESCs can be told apart, and the word labelled FW was not one
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the Scorpion serial number and the field names
        run: lua5.4 bin/esc_parameters_scorpion/verify_scorpion_serial.lua

  # The YGE parameter block is not a fixed size. The flight controller derives its length
  # from the count the ESC itself reports (rotorflight-firmware src/main/io/esc_sensor.c:
  # ygeParamCount = ygeParams[0], paramPayloadLength = ygeParamCount * 2,
  # escGetParamFullBufferLength() = PARAM_HEADER_SIZE + paramPayloadLength with
  # PARAM_HEADER_SIZE = 2, and OPENYGE_PARAM_CACHE_SIZE_MAX = 64), so the real range is
  # 1..64 parameters. The codec described 30 fixed fields, 58 bytes -- 2 + 28 * 2, right for
  # an ESC reporting 28 and for no other.
  #
  # Its own fixture said 32 and stopped at 58: measured, bytes 3..4 read 32 and
  # 2 + 32 * 2 = 66, which is the length the sibling suite's fixture carries for the same
  # ESC. So the shipped fixture described an ESC eight bytes longer than the block it stood
  # for, and every save was that much short.
  #
  # On the write side a short payload is not a truncation. msp.c's only length check on
  # MSP_SET_ESC_PARAMETERS is `if (len == 0)`, sbufReadData's memcpy has no bounds check,
  # and the destination paramUpdBuffer is a static array nothing clears per message -- so
  # the firmware copies the overflow out of the PREVIOUS contents of that buffer and
  # escCommitParameters() writes those bytes to the ESC.
  #
  # Three rules, and the second is the one a reviewer should check hardest:
  #
  #   1. The payload is exactly 2 + 2 * count, with the unknown tail carried through a read
  #      and written back verbatim. Not zeroed: a zero there is a parameter the pilot never
  #      saw and never chose.
  #   2. A block that cannot be written AS THE ESC DESCRIBED IT is REFUSED, not padded.
  #      A count of 0 or one past 64 is refused; a block that arrives short of what its own
  #      count demands is refused; and a count below 28 is refused because the block ends
  #      inside the field list, so at least one named field was never read and writing it
  #      would mean inventing it. That is the misalignment case, and padding it to 58 would
  #      be the defect. The refusal is lib/msp_governor_profile.lua's shape (#2446), and
  #      app/page_runtime.lua:737-753 reads a nil message as a REFUSED write and names the
  #      reason.
  #   3. A field the buffer did not carry stays ABSENT rather than decoding as zero.
  #      mspcodec.lua:57-58 and :70-75 read a missing byte as 0, so a short block used to
  #      decode into a table of plausible zeros with nothing wrong anywhere.
  #
  # 8 of the harness's 12 checks go red without the fix, over every count from 1 to 64
  # rather than a sample. The one that looks like a gate and is not checks the harness's own
  # buffer builder, so it is green in both passes by construction and says so.
  #
  # Three harnesses asserted that the fixture's length EQUALS what their field tables
  # cover, which is what let a fixture describe the wrong ESC. They now assert two things:
  # that the named fields cover the first 58 bytes, and that the fixture's length is what
  # its own count asks for. One of them also drove the codec with a two-field hand-built
  # table, which the refusal now rejects -- correctly, since such a table carries no count
  # and no length -- so it decodes the fixture first and overrides the field under test.
  #
  # Not claimed: the count a real YGE ESC reports. Every number above comes from the
  # fixture; there is no YGE hardware here, and what an ESC does with a misaligned block is
  # unchecked. The firmware-side half of #2458 -- msp.c comparing sbufBytesRemaining(src)
  # against len the way MSP_SET_4WIF_ESC_FWD_PROG does -- is one line in another
  # repository.
  yge-block-length:
    name: The YGE block is as long as the count the ESC reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the YGE block length and the refusal on a short block
        run: lua5.4 bin/esc_parameters_yge/verify_yge_block_length.lua

  # The layout was chosen by a PROFILE KEY. profileKey() returned
  # `<hardware_version>_PL_OPTO` for any OPTO model, and PROFILES carried exactly one such
  # entry, HW1104_V100456NB_PL_OPTO -- so every OTHER OPTO model missed the lookup, fell
  # through to PROFILES.default, and got DEFAULT_ITEMS: bec_voltage at item 5,
  # active_freewheel at 15, where OPTO_ITEMS has no bec_voltage and puts
  # active_freewheel at 14. An OPTO ESC has no BEC byte, so every field from item 5 up
  # was read and written one byte off, on a page that looked entirely normal. Measured
  # on the codec's own simulator fixture, 9 of the 15 fields on the OPTO layout read
  # the wrong byte, plus a phantom bec_voltage row over a byte the block does not have.
  # Six of the 15 coincide: four sit before the missing byte, and two carry equal bytes
  # on either side of the boundary in this fixture.
  #
  # OPTO was also looked for in ONE of the two model strings. The block carries the
  # model twice -- bytes 35..50 as esc_type and 51..65 as mode_name -- plus the
  # firmware version in bytes 3..18, and which of the three a given ESC puts "OPTO" in
  # is not something this file can know. EdgeTX concatenates both model strings for
  # exactly that reason (esc_parameters_hw5.lua:119, :251).
  #
  # The VARIANT chooses the LAYOUT and the VERSION chooses the CHOICE LISTS:
  # profileFor() looks the version up as before and then, for an OPTO model, returns
  # that profile's tables with OPTO_ITEMS. An explicit `<version>_PL_OPTO` entry still
  # wins where one exists, because its tables may differ -- HW1104's do not, but that is
  # a fact about HW1104. The merged profile is built once per version rather than per
  # call, because isFieldAvailable() reaches profileFor() once per field per page build.
  #
  # ON THE ISSUE'S SECOND CLAIM -- the inverted Active Freewheel boolean -- this job
  # changes nothing, and that is the finding. Both suites say 0 = Enabled, 1 = Disabled
  # (here msp_esc_parameters_hw5.lua:21, and EdgeTX's esc_forward_hw5 page:687-690),
  # the codec passes the byte through untouched in both directions, and the flight
  # controller treats the whole HW5 block as opaque and only ever memcmps it
  # (esc_sensor.c:2387-2393). The issue itself writes "0 = Enabled vs 1 = Disabled, or
  # vice versa depending on firmware version" -- a question, not a specification. So
  # there is nothing here to invert. The parity check is a plain check rather than a
  # gate, and it exists so the answer stays a fact the repository carries.
  #
  # Deliberately NOT in this pull request: FIELD_META declares startup_time as min 4,
  # max 25, default 11 while decode() hands the page the raw byte, which runs 0..21, so
  # the row violates its own range. That is a real defect, but it lives in decode() and
  # encode() rather than in the layout, it affects every HW5 model whether OPTO or not,
  # and EdgeTX settles it by adding 4 on the way in and taking 4 off on the way out
  # (esc_parameters_hw5.lua:263-265, :296-298). It has its own harness and its own job.
  #
  # 12 of its 31 checks go red without the fix. Pass --self-test to prove that: it
  # splices the pre-fix profile selection back into a copy of the codec and requires
  # every one of the twelve to fail -- and verifies the splice four ways first, because
  # a sabotage that breaks the module differently from the defect under test proves
  # nothing. One case started out as a gate and the self-test caught it passing on the
  # pre-fix code, which is why it is a plain check now: OPTO hardware HW1104, because
  # that model already worked -- PROFILES carried an entry for it.
  esc-hw5-opto:
    name: Hobbywing V5 OPTO layout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the OPTO layout
        run: lua5.4 bin/esc_hw5_opto/verify_hw5_opto.lua

  # FIELD_META declares startup_time as min 4, max 25, default 11 -- and decode()
  # handed the page the RAW byte, which runs 0..21. So the row's declared range was
  # violated by its own decoder, and an ESC set to its shortest start-up showed "0s" on
  # a row that begins at 4. That contradiction is entirely inside this one file; no
  # outside authority is needed to establish that it exists. Deciding WHICH side of it was
  # wrong does need one, and EdgeTX is it -- this suite has always taken the HW5 layouts
  # from there. It says so four times over:
  #
  #   * its own fixture comment:  11, -- item 6: startup_time (raw 11 -> 15s)
  #     (tasks/msp/api/esc_parameters_hw5.lua:203)
  #   * parse():                   out[fieldName] = rawVal + 4                    (:263-265)
  #   * buildWritePayload():       rawVal = math.max(0, math.min(21,
  #                                 (tonumber(val) or 4) - 4))                       (:296-298)
  #   * the page widget:           min = 4, max = 25, step = 1, suffix = "s"
  #     (app/pages/.../escmfg/hw5/page.lua:617), and its initial ui.config value
  #     startup_time = 15 (:38) -- the fixture's raw 11 plus four.
  #
  # The arithmetic is the cheapest of those arguments and probably the strongest:
  # 4..25 is 22 values and 0..21 is 22 values. A range that is 22 long on the page and 22
  # long on the wire is one range counted from two ends, and it also explains the
  # maximum: 25 - 4 + 1 = 22 = 21 - 0 + 1.
  #
  # startup_time is item 6 in DEFAULT and item 5 in OPTO, and ABSENT from HW1132 and
  # HW1128 -- in both suites -- so the conversion must apply to exactly two of the four
  # layouts.
  #
  # TWO BEHAVIOUR CHANGES worth reading rather than skimming. Both are EdgeTX parity, and
  # both are stated here because parity alone would hide that something gives:
  #
  #   * The clamp is the FIELD's range, 0..21, and not the BYTE's, 0..255. The first
  #     version of this fix clamped to 0..255; a caller outside the page's own range
  #     could then write a raw byte the row says cannot exist. The page's min/max make it
  #     unreachable through the UI, so nothing else in the harness would have noticed.
  #   * A raw byte above 21 is now written back as 21 rather than as itself. Pre-fix an
  #     ESC that sent 22 had its 22 passed through untouched. That is what EdgeTX does and
  #     it is the right default for a field with a range, but it is a change, so it is
  #     gated rather than left as a side effect.
  #
  # The harness found the second one by accident: the whole-block round trip swept all 81
  # byte positions and reported 234 of 20736 values changed, first at byte 71 -- item 6,
  # startup_time. The Startup Time byte is now excluded from that sweep with the reason
  # written down, and its behaviour pinned by a gate of its own.
  #
  # 6 of its 12 checks are gates. Pass --self-test to prove that: it splices the pre-fix
  # decode()/encode() back into a copy of the codec and requires all six to fail, and it
  # verifies its own splice four ways first. Two of the six were gates in the first
  # version and the self-test caught them passing on the pre-fix code -- "every other
  # field is untouched" and "HW1132 and HW1128 do not gain one" both guard the FIX rather
  # than detect the DEFECT, so they are plain checks now. The read gate and the write
  # gate are not redundant: a codec that added four in and subtracted four out is
  # perfectly consistent and would pass every round trip in the file while showing the
  # wrong number.
  esc-hw5-startup:
    name: Hobbywing V5 Startup Time byte
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the Startup Time conversion
        run: lua5.4 bin/esc_hw5_startup/verify_hw5_startup.lua

  # Three of the twenty-one XDFly block's words are stored one below the number
  # the page shows (FIELD_OFFSETS: gov_p 1, gov_i 1, motor_poles 1), and encode()
  # subtracted the bias without clamping the result. A value of 0 therefore packed
  # 0 - 1 = -1, and mspcodec.writeU16 MASKS rather than clamps -- toByte() is
  # math_floor(value) % 256 (lib/mspcodec.lua:85-87) -- so both bytes came out 0xFF.
  #
  # 0xFFFF is not an arbitrary number here. It is what the ESC answers a write it
  # refused, which is the reason the sibling suite guards it:
  # rotorflight-lua-edgetx-suite .../msp/api/esc_parameters_xdfly.lua:146-153 --
  # "a shifted value is never taken below zero: 0xFFFF is what the ESC answers a write
  # it refused, so a word of that shape must not be built here." EdgeTX clamps with
  # `if v < 0 then v = 0 end`. This suite had the same bias table and no clamp, so the
  # two suites disagreed about the one word that carries a refusal.
  #
  # WHAT IS NOT CLAIMED. The page cannot produce a value below the bias: FIELD_META's
  # min equals the bias for all three fields, and field_layout.lua:442-446 hands that
  # straight to form.addNumberField. Measured, not assumed -- case 1 asserts the three
  # floors against the codec's own table. So this is a latent defect, not an observed
  # one, and it is reported as such in #2467. Two things keep it worth fixing rather
  # than documenting: `data and data[key] or 0` packs 0 for an ABSENT key, which lands
  # on 0xFFFF by itself and is the same invented-zero shape #2348 had to fix in
  # msp_governor_profile.lua; and #2339 established there is a second writer besides
  # the widget, which inherits the unguarded subtraction.
  #
  # OMP and ZTW are driven too. Both requireModule() this codec and delegate
  # buildWriteMessage to it (omp:8/:43-46, ztw:8/:43-46), so a clamp landing in only
  # the XDFLY file would leave two vendors broken -- and pass 2 of the self-test has to
  # seed the base key with the sabotaged codec before loading them, or requireModule()
  # re-reads the repaired file off disk and both vendor gates stay green.
  #
  # 8 of its 22 checks are gates. Pass --self-test to prove that: it cuts the clamp out
  # of encode() and requires all eight to go red, comparing verdicts BY NAME. It
  # verifies its own cut five ways first. Two of those verifications exist because this
  # file got it wrong first, and both failures were silent -- pass 2 ran the FIXED
  # codec twice and reported every gate green:
  #   * "  for i = 1, #EDIT_FIELDS do" appears in decode() AND in encode(), so a cut
  #     anchored on the loop alone replaced the wrong one and left the clamp standing.
  #   * the codec's own self-cache guard is keyed "rfsuite.lib.msp_esc_parameters_xdfly",
  #     so loading the sabotaged copy under a different key cleared nothing and the
  #     guard returned the fixed module.
  #
  # Three checks are deliberately NOT gates, and the file says which: the
  # FIELD_OFFSETS round-trip over the legal range (the pre-fix code got that right --
  # it is why #2343 does not reproduce), the whole-block sweep, and the two vendors'
  # signature bytes. The sweep is the subtle one: without the clamp, -1 masks to 0xFFFF
  # inside the SAME two bytes the clamp writes, so it cannot tell the defect from the
  # fix. A gate that cannot fail is worse than no check at all.
  esc-xdfly-bias:
    name: The biased ESC words never reach 0xFFFF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the lower clamp on the biased ESC words
        run: lua5.4 bin/esc_xdfly_bias/verify_xdfly_bias.lua

  # Issue #2342 asks for the protocol lists to be built from what the FC reports
  # instead of from static arrays. The motor half of that turned out to be three facts, and
  # the one that mattered was not in the issue.
  #
  # THE DISABLED ENTRY WAS ON THE WRONG VALUE. rotorflight-firmware's own enum --
  # src/main/drivers/motor.h, master 2026-10-04 -- reads:
  #
  #     PWM_TYPE_CASTLE_LINK,   9
  #     PWM_TYPE_SRXL2,        10
  #     PWM_TYPE_DISABLED,     11
  #
  # lib/msp_motor_config.lua had no SRXL2, so its DISABLED entry inherited the next free
  # number: 10. Ten is SRXL2. Selecting DISABLED therefore wrote SRXL2 to the flight
  # controller -- arming a serial ESC link instead of switching the motor output off.
  #
  # It stayed invisible because both ends agreed on the wrong number: the codec said 10 and
  # so did the four places that fell back to it (esc_motors_throttle.lua's pwmFieldsEnabled()
  # and refreshProtocolFields(), esc_motors_rpm.lua's isDshotProtocol() and its wakeup
  # handler). A round trip through this suite's own code agreed perfectly. Only the
  # firmware's enum says otherwise -- which is why the enum is transcribed into the harness
  # rather than read from the suite, and why the pages now take DISABLED from
  # motorConfig.DISABLED_PROTOCOL instead of a literal.
  #
  # SRXL2 WAS MISSING, and it is real: it reached drivers/motor.h on 2026-08-08 (e72e209d,
  # #421) and the API minor went to 10 nine days later (ac1f1730, #484), so its floor is
  # 12.10 -- which is what EdgeTX gates the same list on
  # (esc_motors/throttle/page.lua:395). This suite's own floor is 12.09
  # (lib/msp_api_version.lua:69-73), so an FC it will happily talk to CAN be older than
  # SRXL2. The value arrives with no new plumbing: tasks/session.lua already publishes
  # apiVersionMinor in its "session.update" snapshot, page_runtime already subscribes, and
  # lib/bus.lua:18/:97 already replays the retained snapshot synchronously -- so it is set
  # before the page's first buildSingle().
  #
  # BRUSHED IS NOT A PROTOCOL. The firmware removed it on 2022-10-19 (9d1645a8) and kept
  # slot 4 as a placeholder so the numbers after it would not move; the enum still carries
  # "// BRUSHED" on PWM_TYPE_RESERVED, and checkMotorProtocolEnabled()
  # (src/main/drivers/motor.c:154-176) has no case for it. It leaves the menu.
  #
  # WHAT IS NOT CLAIMED. The firmware gates these protocols on BUILD flags -- #ifdef
  # USE_DSHOT, USE_TELEMETRY_CASTLE, USE_SRXL2_ESC -- and no MSP message reports them to the
  # sender. The API version is a PROXY, not the fact: a target built without USE_SRXL2_ESC
  # while reporting 12.10 is still offered SRXL2 and will refuse it at arm time. Nothing on
  # the wire can do better, and this job pins the proxy instead of pretending to have the
  # capability bits.
  #
  # CASTLE has no version gate here on purpose. EdgeTX gates it at 12.0.8, but this suite
  # refuses to operate below 12.09, so a gate could never fire.
  #
  # KNOWN AND NOT FIXED: a pilot whose FC sits on the reserved slot sees a choice row whose
  # value is not in the list. Whether Ethos draws that blank or snaps it to the first entry
  # is not answerable from this repository and needs a live check. No data is at risk --
  # choiceGet() returns the stored value unchanged and encode() writes back what was read.
  #
  # 8 of its 22 checks are gates. Pass --self-test to prove that: it cuts the fix back out of
  # THREE files -- the DISABLED constant, the choice function and the page's row-state test
  # -- and requires all eight to fail, because the pre-fix defect was the static table PLUS
  # four bare 10s and cutting one file left eight of thirteen gates green. Five checks are
  # plain: four guard against the version check failing OPEN, one is a smoke test.
  motor-protocol:
    name: Throttle Protocol list follows the flight controller
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the motor protocol list and its defaults
        run: lua5.4 bin/motor_protocol/verify_motor_protocol.lua

  # lib/msp_esc_parameters_scorpion.lua described 76 bytes where the flight
  # controller's block for a Scorpion is 84. The last eight are two U32 words the sibling
  # suite names stick_max and stick_zero; this codec stopped at gov_integral.
  #
  # That is not cosmetic on the write path. msp.c's MSP_SET_ESC_PARAMETERS is an opaque move
  # of escGetParamBufferLength() bytes, and its only length check is `len == 0`.
  #
  #     const uint8_t len = escGetParamBufferLength();
  #     if (len == 0) return MSP_RESULT_ERROR;
  #     sbufReadData(src, escGetParamUpdBuffer(), len);
  #     if (!escCommitParameters()) return MSP_RESULT_ERROR;
  #
  # sbufReadData is an unchecked memcpy and the destination paramUpdBuffer is a persistent
  # static array nothing clears per message -- escGetParamUpdBuffer() re-fills it from
  # paramBuffer only in the BLHeli_S case. So a 76-byte payload leaves the firmware copying
  # eight bytes from past the end of the received frame into escCommitParameters and on to
  # the ESC, and the last two words are stored from whatever those bytes were.
  #
  # Where 84 comes from (rotorflight-firmware src/main/sensors/esc_sensor.c; the Scorpion is
  # ESC_SIG_TRIB = 0x53, served by tribSensorInit, not the 4-way path):
  #
  #     static uint16_t tribParamAddrLen[] =
  #         { 0x0020, 0x1008, 0x230E, 0x8204, 0x8502, 0x1406, 0x1808, 0x3408 };
  #     tribCalcParamBufferLength() sums (x & 0xFF)      -> 32+8+14+4+2+6+8+8 = 82
  #     #define PARAM_HEADER_SIZE 2
  #     escGetParamBufferLength() = PARAM_HEADER_SIZE + it -> 2 + 82 = 84
  #
  # The TRIB path sets paramPayloadLength = tribCalcParamBufferLength() when the ESC's
  # UNC/status handshake completes (tribDecodeReadStatusResp), so the length is a constant 84
  # for this vendor, not a count the ESC varies.
  #
  # The codec and its fixture now carry the two words, taken verbatim from the sibling's
  # FIELD_SPEC / SIM_RESPONSE, and the page builds no row for either -- they are carried through
  # a read and written back verbatim.
  #
  # 6 of the harness's 12 checks go red without the fix, proven by --self-test: it cuts the
  # two stick fields out of REST_FIELDS and the eight fixture bytes back out and requires every
  # one to fail. Two checks that look like gates are deliberately not -- the transcribed trib
  # table is a constant here, and the two-transcription offset parity check never reads the
  # codec -- and the file says so.
  esc-parameters-scorpion-block-length:
    name: The Scorpion block is the length the flight controller asks for
  # In app/pages/esc_forward_vendor.lua, the ESC summary header was rendered using
  # form.addLine(mspModule.summaryFor(data, pageTitle)). In Ethos, form.addLine()
  # splits each line into a left label column and a right widget column, clipping
  # the label column at ~32 characters on standard screens (e.g. 480x320).
  # When the summary line includes the model name, firmware version, and serial number
  # (e.g. "YGE Saphir 125 / 1.03576 / S/N 100770", 37 characters), the text past 32 chars
  # was vertically sliced on the column boundary (showing "... S/N 1C"), and the rest of
  # the serial number was clipped off while the right half of the line remained empty.
  #
  # The summary is now rendered via escError.addTextLine(summary), which creates an empty
  # line and spans form.addStaticText across the full display width (x = 0, w =
  # lcd.getWindowSize()).
  #
  # 2 of the 5 checks in bin/esc_summary/verify_esc_summary.lua are gates and go red on
  # the pre-fix code, proven by --self-test.
  esc-summary-full-width:
    name: ESC summary header spans full width without 2-column clipping
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Check the Scorpion block length and the appended stick words
        run: lua5.4 bin/esc_parameters_scorpion/verify_scorpion_block_length.lua
      - name: Check the ESC summary header width and line layout
        run: lua5.4 bin/esc_summary/verify_esc_summary.lua

  # Per-language PR builds (mirrors push.yml behavior)
  create-zip:
    name: Build PR ZIP (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keep this in sync with push.yml (add locales as translations land)
        lang: [en, de, es, fr, it, nl, pt-br, no, cs, pl, he, zh-cn]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set build variables (PR version)
        run: |
          PR_NUMBER='${{ github.event.pull_request.number }}'
          echo "GIT_VER=PR-${PR_NUMBER}" >> $GITHUB_ENV

      - name: Create rotorflight-lua-ethos-suite-lite-${{ env.GIT_VER }}-${{ matrix.lang }}.zip
        run: |
          python bin/package/build_package.py \
            --lang '${{ matrix.lang }}' \
            --artifact-version '${{ env.GIT_VER }}' \
            --artifact-name 'rotorflight-lua-ethos-suite-lite-${{ env.GIT_VER }}-${{ matrix.lang }}.zip' \
            --output-dir .

      - name: Validate ETHOS package manifest
        run: |
          python bin/package/validate_ethos_manifest_zip.py \
            'rotorflight-lua-ethos-suite-lite-${{ env.GIT_VER }}-${{ matrix.lang }}.zip'

      - name: Upload per-locale ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rotorflight-lua-ethos-suite-lite-${{ env.GIT_VER }}-${{ matrix.lang }}
          path: rotorflight-lua-ethos-suite-lite-${{ env.GIT_VER }}-${{ matrix.lang }}.zip
          if-no-files-found: error

  # A Diagnostics page cannot be looked at from a pull request, and the one
  # that broke was invisible by construction: app/pages/diagnostics_fblstatus.lua
  # joined every active arming-disable flag into one value-column string, and
  # that column is the narrow right-hand half of the line, so on a 480x320
  # radio the reason the model would not arm was clipped off the right edge.
  #
  # The mask arithmetic now lives in lib/arming_flags.lua with no dependency on
  # form or lcd, so it can be stepped here; the widths of the translated strings
  # are the half that needs the locale files, and the two run together because
  # neither one is worth anything without the other.
  fblstatus:
    name: Arming flags readable at any resolution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove the width check can go red
        run: python bin/fblstatus/verify_arming_flag_widths.py --self-test

      - name: Check the arming flag mask and the page's use of it
        run: lua5.4 bin/fblstatus/verify_arming_flags.lua

      - name: Check every locale's flag strings against the row widths
        run: python bin/fblstatus/verify_arming_flag_widths.py

  # tasks/elrs_sensors.lua's parseFrame() stops at the first appId it has no
  # decoder for and cannot skip it -- the pair's byte width lives only in
  # src/rfsuite/lib/elrs_sensor_table.lua. So one appId the table is missing
  # silently costs every sensor packed after it in the same frame, and the
  # symptom looks like a dead sensor. Nothing in the tree could see that, so
  # the table is compared against the firmware's TLM_SENSOR(...) list.
  #
  # The firmware file is read from a pinned snapshot tag, so a firmware that
  # adds an appId shows up here as a deliberate change to this check rather
  # than as a frame-walk abort on a pilot's radio.
  sensor-table-completeness:
    name: Sensor table completeness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove the check can go red
        run: python bin/telemetry/verify_sensor_table.py --self-test

      - name: Check every broadcast appId has a decoder
        run: python bin/telemetry/verify_sensor_table.py

  # The rule in .agents/rules/documentation.md asks that a change a pilot can observe
  # updates its page file in the same pull request, and that a pull request which needs
  # no documentation change says why. Nothing checked either half, so both rested on
  # the author remembering at the moment they are least likely to.
  #
  # The check is deliberately narrower than the rule says, because no static check can
  # decide what a pilot can observe: it asks nothing of a pull request that changes
  # nothing under src/, passes one that changes src/ and also docs/, and passes one
  # that changes src/ and no docs/ only if its body carries a `Documentation:` line of
  # its own. Whether that reason is a good one is the reviewer's call.
  documentation-rule:
    name: Documentation rule
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # the check diffs against the base commit, which a shallow clone does not carry
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove the check can go red
        run: python bin/docs/verify_documentation_rule.py --self-test

      - name: Write the pull request body to a file
        # through the environment, never interpolated into the script: a pull request
        # body is text anybody can write
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr-body.txt

      - name: Check the documentation rule
        run: |
          python bin/docs/verify_documentation_rule.py \
            --base '${{ github.event.pull_request.base.sha }}' \
            --body-file pr-body.txt

  # pr.yml used to be edited by hand, and every pull request that added a
  # harness job put it in the same place in the file. Three of them were open
  # at once on 2026-09-30, and each collision cost a resolution rather than a
  # merge. Two of those resolutions were wrong in a way nothing caught:
  # #2414's squash left dashboard-image-caches with a name and no runs-on, and
  # #2416's squash did the same to field-layout, so the file stopped loading as
  # a workflow and the run on master reported failure with zero jobs.
  #
  # The file is now rendered from bin/ci/pr_jobs.py. This job is the other half
  # of that: a registry that is edited without regenerating leaves the two
  # disagreeing, and the next pull request to add a job inherits the old file
  # and the same collision. It also pins the shape that broke twice -- every job
  # needs a runs-on and at least one step.
  #
  # The self-test proves the checks can go red: it removes a runs-on from a
  # rendered job, edits a line of the committed file, and adds a job naming a
  # harness that does not exist, and each of those has to be reported.
  pr-workflow-drift:
    name: The pull request workflow matches its registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove the check can go red
        run: python bin/ci/verify_pr_workflow.py --self-test

      - name: Check pr.yml against the registry
        run: python bin/ci/verify_pr_workflow.py
